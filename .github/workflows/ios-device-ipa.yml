
name: Build iOS Device IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios-device:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Integrate KMPNotifier Swift Package
        env:
          XCODEPROJ_PATH: ${{ github.workspace }}/iosApp/iosApp.xcodeproj
        run: ./gradlew :shared:integrateLinkagePackage

      - name: Build iOS Device App
        run: |
          set -o pipefail

          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/derivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package Unsigned IPA
        run: |
          set -euo pipefail

          APP_PATH="build/derivedData/Build/Products/Release-iphoneos/KMPProjectDemo.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Built iOS app not found at $APP_PATH"
            find build/derivedData/Build/Products -maxdepth 3 -type d
            exit 1
          fi

          rm -rf build/ipa
          mkdir -p build/ipa/Payload

          ditto "$APP_PATH" build/ipa/Payload/KMPProjectDemo.app

          cd build/ipa
          zip -qry "$GITHUB_WORKSPACE/KMPProjectDemo-unsigned-iphoneos.ipa" Payload

          test -s "$GITHUB_WORKSPACE/KMPProjectDemo-unsigned-iphoneos.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KMPProjectDemo-unsigned-iphoneos
          path: KMPProjectDemo-unsigned-iphoneos.ipa
          if-no-files-found: error
          retention-days: 7
