name: Build iOS Simulator App for Appetize

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ios-simulator:
    runs-on: macos-15
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Diagnose Xcode (Before Selection)
        run: |
          echo "=== BEFORE XCODE SELECTION ==="
          echo "Active developer dir:"
          xcode-select -p
          echo "Active xcodebuild version:"
          xcodebuild -version
          echo "Available Xcodes in /Applications:"
          ls -d /Applications/Xcode* || true

      - name: Select and Verify Compatible Xcode (16+)
        run: |
          SELECTED_XCODE=""
          # Search for Xcode 16 or newer in descending order
          for x in $(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -r); do
            if [ -d "$x" ]; then
              SELECTED_XCODE="$x"
              break
            fi
          done

          if [ -z "$SELECTED_XCODE" ] && [ -d "/Applications/Xcode.app" ]; then
            SELECTED_XCODE="/Applications/Xcode.app"
          fi

          if [ -n "$SELECTED_XCODE" ]; then
            echo "Switching to Xcode at: $SELECTED_XCODE"
            sudo xcode-select -s "$SELECTED_XCODE/Contents/Developer"
          fi

          echo "=== AFTER XCODE SELECTION ==="
          echo "Active developer dir:"
          xcode-select -p
          echo "Active xcodebuild version:"
          
          VERSION_OUTPUT=$(xcodebuild -version)
          echo "$VERSION_OUTPUT"
          
          # Extract major version number (e.g., "Xcode 16.2" -> 16)
          VERSION_NUM=$(echo "$VERSION_OUTPUT" | grep "Xcode" | awk '{print $2}' | cut -d. -f1)
          
          if [ -z "$VERSION_NUM" ] || [ "$VERSION_NUM" -lt 16 ]; then
            echo "ERROR: Xcode version must be 16 or higher to support objectVersion 77. Current major version is: $VERSION_NUM"
            exit 1
          fi

      - name: Verify Project and Schemes
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -list

      - name: Build iOS Simulator App
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
                     -scheme iosApp \
                     -sdk iphonesimulator \
                     -configuration Debug \
                     -derivedDataPath build/derivedData \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     build

      - name: Package App for Appetize.io
        run: |
          APP_PATH="build/derivedData/Build/Products/Debug-iphonesimulator/iosApp.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Error: iosApp.app not found at $APP_PATH"
            echo "Listing DerivedData contents for debugging:"
            find build/derivedData -name "*.app" || true
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          mkdir -p payload
          cp -r "$APP_PATH" payload/
          cd payload
          zip -r ../iosApp.zip iosApp.app
          cd ..

      - name: Upload iOS Simulator Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iosApp-simulator
          path: iosApp.zip
