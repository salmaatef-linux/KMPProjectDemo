name: Build iOS Simulator for Appetize

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ios-simulator:
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Select and Verify Xcode
        run: |
          echo "=== Available Xcodes ==="
          ls -d /Applications/Xcode*.app || true

          if [ -d "/Applications/Xcode_16.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          else
            echo "ERROR: No expected Xcode installation found"
            exit 1
          fi

          echo "=== Selected Xcode ==="
          xcode-select -p
          xcodebuild -version

          echo "=== Available Simulator Runtimes ==="
          xcrun simctl list runtimes

      - name: Verify Project and Schemes
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -list

      - name: Integrate KMPNotifier Swift Package
        env:
          XCODEPROJ_PATH: ${{ github.workspace }}/iosApp/iosApp.xcodeproj
        run: |
          ./gradlew :shared:integrateLinkagePackage

      - name: Build iOS Simulator App
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build/derivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package App for Appetize
        run: |
          APP_PATH="build/derivedData/Build/Products/Debug-iphonesimulator/KMPProjectDemo.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Simulator app not found at $APP_PATH"
            echo "Searching for generated app bundles:"
            find build/derivedData -name "*.app" -type d || true
            exit 1
          fi

          mkdir -p build/package
          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" build/package/KMPProjectDemo-ios-simulator.zip

      - name: Upload iOS Simulator Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KMPProjectDemo-ios-simulator
          path: build/package/KMPProjectDemo-ios-simulator.zip
          if-no-files-found: error

